{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — КурьерПро</title>
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<div style="width:300px; margin:60px auto">
  <h2>КурьерПро — вход</h2>
  {% if error %}<div class="msg msg-danger">{{ error }}</div>{% endif %}
  {% for message in messages %}<div class="msg msg-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
  <form method="POST">
    {% csrf_token %}
    <p><label>Логин<br><input type="text" name="username" required autofocus style="width:100%"></label></p>
    <p><label>Пароль<br><input type="password" name="password" required style="width:100%"></label></p>
    <button type="submit">Войти</button>
  </form>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
